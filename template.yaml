AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Surya Lekka - checks a household's rooftop solar quote before they sign.

Parameters:
  SiteOrigin:
    Type: String
    Description: The web app's origin (scheme and host, no trailing slash), used for CORS.
    AllowedPattern: "^https?://[A-Za-z0-9.-]+(:[0-9]+)?$"
  StackPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,30}$"
    Description: >-
      Lower-case stack name (scripts/deploy.ps1 passes it). The bucket is named
      <prefix>-<account id>-<region>, so each stack in an account and Region gets its own bucket.
  UploadsEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Kill switch for uploads and live samples. Saved sample readings still work.
  DailyJobCap:
    Type: Number
    Default: 200
    MinValue: 0
    Description: New checks allowed per UTC day, live samples included. 0 refuses every new check.
  IpDailyJobCap:
    Type: Number
    Default: 10
    MinValue: 0
    Description: New checks allowed per source IP address per UTC day. 0 refuses every new check.
  ReadingEngine:
    Type: String
    Default: none
    AllowedValues: [none, nova]
    Description: >-
      What reads uploaded quotes. none switches reading off: uploads and live samples are refused,
      while saved sample readings and typed-in numbers keep working. More engines can be added here.
  ModelId:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Za-z0-9._:-]{0,128}$"
    Description: >-
      Model for ReadingEngine nova: an inference profile ID (global. or apac.) or a model ID in this
      Region (for example amazon.nova-pro-v1:0, for accounts that can't use cross-Region inference).
  ProfileModelArns:
    Type: CommaDelimitedList
    Default: none
    Description: >-
      Model ARNs in each Region the inference profile routes to, or none for a model ID in this Region.
      scripts/deploy.ps1 reads them with aws bedrock get-inference-profile.
  GlobalModelArns:
    Type: CommaDelimitedList
    Default: none
    Description: >-
      Model ARNs with no Region, which a global inference profile routes to, or none.
      scripts/deploy.ps1 reads them with aws bedrock get-inference-profile.
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Reserved concurrency for the worker. 0 leaves it off. Lambda keeps at least 100 of an account's
      concurrency unreserved, so reserving any fails the deploy on an account whose total limit is 100
      or less (new accounts often have 10).

Rules:
  SupportedRegion:
    Assertions:
      - Assert: !Contains [[ap-south-1, ap-southeast-2], !Ref "AWS::Region"]
        AssertDescription: >-
          Deploy in ap-south-1 (Mumbai) or ap-southeast-2 (Sydney). The web app's privacy notice names
          the Region, and these are the two it knows.
  NovaNeedsAModel:
    RuleCondition: !Equals [!Ref ReadingEngine, nova]
    Assertions:
      - Assert: !Not [!Equals [!Ref ModelId, ""]]
        AssertDescription: ReadingEngine nova needs a ModelId.

Conditions:
  UseReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  NovaReading: !Equals [!Ref ReadingEngine, nova]
  HasRegionalModels: !Not [!Equals [!Join [",", !Ref ProfileModelArns], none]]
  HasGlobalModels: !Not [!Equals [!Join [",", !Ref GlobalModelArns], none]]
  NovaThroughProfile: !And [!Condition NovaReading, !Or [!Condition HasRegionalModels, !Condition HasGlobalModels]]
  NovaRegionalModels: !And [!Condition NovaReading, !Condition HasRegionalModels]
  NovaGlobalModels: !And [!Condition NovaReading, !Condition HasGlobalModels]
  NovaInRegion: !And [!Condition NovaReading, !Not [!Condition NovaThroughProfile]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 15
    # X-Ray traces the invocations only (no SDK in the code), so no request or document data is recorded.
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref JobsTable
        BUCKET_NAME: !Sub "${StackPrefix}-${AWS::AccountId}-${AWS::Region}"
        UPLOADS_ENABLED: !Ref UploadsEnabled
        READING_ENGINE: !Ref ReadingEngine
        DAILY_JOB_CAP: !Ref DailyJobCap
        IP_DAILY_JOB_CAP: !Ref IpDailyJobCap
        IP_HASH_KEY: !Ref AWS::StackId
        JOB_TTL_HOURS: "24"

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackPrefix}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref SiteOrigin]
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub "${UploadBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref SiteOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  CreateJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.create_job
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs
            Method: POST

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.get_job
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{id}
            Method: GET

  RecheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.recheck
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{id}/checks
            Method: POST

  RetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.retry_job
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{id}/retry
            Method: POST

  # Checks on numbers the user typed in: no storage, no model call, so no extra permissions.
  ManualCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.manual.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /checks
            Method: POST

  SampleJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.create_sample_job
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/samples/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /samples/{sample_id}
            Method: POST

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.worker.handler
      MemorySize: 512
      Timeout: 900
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt WorkerFailures.Arn
      Policies:
        - Statement:
            - Sid: ReadAndDeleteUploads
              Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
            - Sid: JobsTableOnly
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
        # Bedrock only while Nova reads the quotes. Through an inference profile: the profile in this
        # Region, then the model in each Region it routes to, only when called through that profile.
        - !If
          - NovaThroughProfile
          - Statement:
              - Sid: NovaInferenceProfile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
          - !Ref AWS::NoValue
        - !If
          - NovaRegionalModels
          - Statement:
              - Sid: NovaProfileRegions
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref ProfileModelArns
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
          - !Ref AWS::NoValue
        - !If
          - NovaGlobalModels
          - Statement:
              - Sid: NovaGlobalRouting
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref GlobalModelArns
                Condition:
                  StringEquals:
                    aws:RequestedRegion: unspecified
                    bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
          - !Ref AWS::NoValue
        - !If
          - NovaInRegion
          - Statement:
              - Sid: NovaInRegionModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
          - !Ref AWS::NoValue
      Events:
        ManifestUploaded:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
                  - Name: suffix
                    Value: manifest.json

  # Events the worker could not handle after Lambda's retry. Each record names the
  # job's upload key and the error type, never document content.
  WorkerFailures:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true

  CreateJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CreateJobFunction}"
      RetentionInDays: 7

  GetJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetJobFunction}"
      RetentionInDays: 7

  RecheckLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RecheckFunction}"
      RetentionInDays: 7

  RetryLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RetryFunction}"
      RetentionInDays: 7

  ManualCheckLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ManualCheckFunction}"
      RetentionInDays: 7

  SampleJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SampleJobFunction}"
      RetentionInDays: 7

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WorkerFunction}"
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  BucketName:
    Description: Private bucket for page uploads and the sample pages.
    Value: !Ref UploadBucket
