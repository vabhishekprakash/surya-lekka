AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Surya Lekka - checks a household's rooftop solar quote before they sign.

Parameters:
  SiteOrigin:
    Type: String
    Description: The web app's origin (scheme and host, no trailing slash), used for CORS.
    AllowedPattern: "^https?://[A-Za-z0-9.-]+(:[0-9]+)?$"
  BucketNamePrefix:
    Type: String
    Default: surya-lekka
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,30}$"
    Description: The bucket is named <prefix>-<account id>-<region>.
  UploadsEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Kill switch for new checks.
  DailyJobCap:
    Type: Number
    Default: 200
    MinValue: 0
    Description: New checks allowed per UTC day, samples included.
  ModelId:
    Type: String
    Default: global.amazon.nova-2-lite-v1:0
    AllowedValues: [global.amazon.nova-2-lite-v1:0, apac.amazon.nova-pro-v1:0]
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Reserved concurrency for the worker. 0 leaves it off. New accounts often have a total limit of 10 and
      AWS keeps at least 10 unreserved, so reserving any would fail the deploy there.

Conditions:
  UseReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        TABLE_NAME: !Ref JobsTable
        BUCKET_NAME: !Sub "${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}"
        UPLOADS_ENABLED: !Ref UploadsEnabled
        DAILY_JOB_CAP: !Ref DailyJobCap
        JOB_TTL_HOURS: "24"

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref SiteOrigin]
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub "${UploadBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref SiteOrigin]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  CreateJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.create_job
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs
            Method: POST

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.get_job
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{id}
            Method: GET

  RecheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.recheck
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{id}/checks
            Method: POST

  SampleJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.create_sample_job
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}/samples/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /samples/{sample_id}
            Method: POST

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.worker.handler
      MemorySize: 512
      Timeout: 600
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 3600
      Policies:
        - Statement:
            - Sid: InvokeThroughInferenceProfiles
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.amazon.nova-2-lite-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
            - Sid: FoundationModelsBehindTheProfiles
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-2-lite-v1:0"
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/amazon.nova-pro-v1:0"
              Condition:
                StringLike:
                  bedrock:InferenceProfileArn:
                    - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.amazon.nova-2-lite-v1:0"
                    - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/apac.amazon.nova-pro-v1:0"
            - Sid: GlobalProfileRouting
              Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub "arn:${AWS::Partition}:bedrock:::foundation-model/amazon.nova-2-lite-v1:0"
              Condition:
                StringEquals:
                  aws:RequestedRegion: unspecified
                StringLike:
                  bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/global.amazon.nova-2-lite-v1:0"
            - Sid: ReadAndDeleteUploads
              Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketNamePrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
            - Sid: JobsTableOnly
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
      Events:
        ManifestUploaded:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
                  - Name: suffix
                    Value: manifest.json

  CreateJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CreateJobFunction}"
      RetentionInDays: 7

  GetJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetJobFunction}"
      RetentionInDays: 7

  RecheckLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RecheckFunction}"
      RetentionInDays: 7

  SampleJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SampleJobFunction}"
      RetentionInDays: 7

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WorkerFunction}"
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  BucketName:
    Description: Private bucket for page uploads and the sample pages.
    Value: !Ref UploadBucket
