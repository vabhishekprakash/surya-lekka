AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Surya Lekka - checks a household's rooftop solar quote before they sign.

Parameters:
  HostingEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Serve web/ from a private S3 bucket through CloudFront. Use false on an account that can't create
      CloudFront distributions yet, and open web/ locally against the API instead (see the README).
  SiteOrigin:
    Type: String
    Default: http://127.0.0.1:8000
    Description: >-
      The only origin allowed to call the API when HostingEnabled is false: where web/ is opened locally
      (scheme and host, no trailing slash). With hosting on, the CloudFront domain is used instead.
    AllowedPattern: "^https?://[A-Za-z0-9.-]+(:[0-9]+)?$"
  SecondSiteOrigin:
    Type: String
    Default: none
    Description: >-
      A second origin allowed to call the API when HostingEnabled is false, such as the Amplify Hosting
      domain (https://main.<app id>.amplifyapp.com), or none.
    AllowedPattern: "^(none|https://[A-Za-z0-9.-]+)$"
  StackPrefix:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,30}$"
    Description: >-
      Lower-case stack name (scripts/deploy.ps1 passes it). The bucket is named
      <prefix>-<account id>-<region>, so each stack in an account and Region gets its own bucket.
  UploadsEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Kill switch for uploads and live samples. Saved sample readings still work.
  DailyJobCap:
    Type: Number
    Default: 200
    MinValue: 0
    Description: New checks allowed per UTC day, live samples included. 0 refuses every new check.
  DailyPageCap:
    Type: Number
    Default: 300
    MinValue: 0
    Description: >-
      Pages allowed per UTC day across all new checks, live samples included, counted from each
      check's declared page count when it is created. 0 refuses every new check.
  AlarmEmail:
    Type: String
    Default: none
    Description: >-
      Where the alarms are emailed (the address must confirm the subscription), or none. Passed at
      deploy time; never stored in the repository.
    AllowedPattern: "^(none|[^@\\s]+@[^@\\s]+\\.[^@\\s]+)$"
  SampleDailyCap:
    Type: Number
    Default: 1000
    MinValue: 0
    Description: Saved samples a day, overall. 0 refuses every sample.
  IpSampleDailyCap:
    Type: Number
    Default: 50
    MinValue: 0
    Description: Saved samples a day from one source address. 0 refuses every sample.
  TypedDailyCap:
    Type: Number
    Default: 5000
    MinValue: 0
    Description: Typed-in checks a day, overall. 0 refuses every typed check.
  IpTypedDailyCap:
    Type: Number
    Default: 200
    MinValue: 0
    Description: Typed-in checks a day from one source address. 0 refuses every typed check.
  IpDailyJobCap:
    Type: Number
    Default: 10
    MinValue: 0
    Description: New checks allowed per source IP address per UTC day. 0 refuses every new check.
  ReadingEngine:
    Type: String
    Default: none
    AllowedValues: [none, nova, textract]
    Description: >-
      What reads uploaded quotes: nova (Amazon Nova through Bedrock) or textract (Amazon Textract
      AnalyzeDocument with tables and queries, in this Region). none switches reading off: uploads
      and live samples are refused, while saved sample readings and typed-in numbers keep working.
  ModelId:
    Type: String
    Default: ""
    AllowedPattern: "^[A-Za-z0-9._:-]{0,128}$"
    Description: >-
      Model for ReadingEngine nova: an inference profile ID (global. or apac.) or a model ID in this
      Region (for example amazon.nova-pro-v1:0, for accounts that can't use cross-Region inference).
  ProfileModelArns:
    Type: CommaDelimitedList
    Default: none
    Description: >-
      Model ARNs in each Region the inference profile routes to, or none for a model ID in this Region.
      scripts/deploy.ps1 reads them with aws bedrock get-inference-profile.
  GlobalModelArns:
    Type: CommaDelimitedList
    Default: none
    Description: >-
      Model ARNs with no Region, which a global inference profile routes to, or none.
      scripts/deploy.ps1 reads them with aws bedrock get-inference-profile.
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Reserved concurrency for the worker. 0 leaves it off. Lambda keeps at least 100 of an account's
      concurrency unreserved, so reserving any fails the deploy on an account whose total limit is 100
      or less (new accounts often have 10).

Rules:
  SupportedRegion:
    Assertions:
      - Assert: !Contains [[ap-south-1, ap-southeast-2], !Ref "AWS::Region"]
        AssertDescription: >-
          Deploy in ap-south-1 (Mumbai) or ap-southeast-2 (Sydney). The web app's privacy notice names
          the Region, and these are the two it knows.
  NovaNeedsAModel:
    RuleCondition: !Equals [!Ref ReadingEngine, nova]
    Assertions:
      - Assert: !Not [!Equals [!Ref ModelId, ""]]
        AssertDescription: ReadingEngine nova needs a ModelId.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, none]]
  Hosting: !Equals [!Ref HostingEnabled, "true"]
  HasSecondOrigin: !Not [!Equals [!Ref SecondSiteOrigin, none]]
  SecondOrigin: !And [!Not [!Condition Hosting], !Condition HasSecondOrigin]
  UseReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  NovaReading: !Equals [!Ref ReadingEngine, nova]
  TextractReading: !Equals [!Ref ReadingEngine, textract]
  HasRegionalModels: !Not [!Equals [!Join [",", !Ref ProfileModelArns], none]]
  HasGlobalModels: !Not [!Equals [!Join [",", !Ref GlobalModelArns], none]]
  NovaThroughProfile: !And [!Condition NovaReading, !Or [!Condition HasRegionalModels, !Condition HasGlobalModels]]
  NovaRegionalModels: !And [!Condition NovaReading, !Condition HasRegionalModels]
  NovaGlobalModels: !And [!Condition NovaReading, !Condition HasGlobalModels]
  NovaInRegion: !And [!Condition NovaReading, !Not [!Condition NovaThroughProfile]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 15
    # X-Ray traces the invocations only (no SDK in the code), so no request or document data is recorded.
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref JobsTable
        BUCKET_NAME: !Sub "${StackPrefix}-${AWS::AccountId}-${AWS::Region}"
        UPLOADS_ENABLED: !Ref UploadsEnabled
        READING_ENGINE: !Ref ReadingEngine
        DAILY_JOB_CAP: !Ref DailyJobCap
        DAILY_PAGE_CAP: !Ref DailyPageCap
        IP_DAILY_JOB_CAP: !Ref IpDailyJobCap
        SAMPLE_DAILY_CAP: !Ref SampleDailyCap
        IP_SAMPLE_DAILY_CAP: !Ref IpSampleDailyCap
        TYPED_DAILY_CAP: !Ref TypedDailyCap
        IP_TYPED_DAILY_CAP: !Ref IpTypedDailyCap
        IP_HASH_KEY: !Ref AWS::StackId
        JOB_TTL_HOURS: "24"
        # The secret's ARN, not its value. Only the functions granted ReadConfirmSecret can read it.
        CONFIRM_SECRET_ARN: !Ref ConfirmSecret

Resources:
  # Signs the tokens a household's confirmations carry (HMAC-SHA256), so the API accepts only
  # tokens it issued for that job and review revision. Generated here; never in the repo or logs.
  ConfirmSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Signs Surya Lekka confirmation tokens. Generated by CloudFormation.
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${StackPrefix}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # A list, not one !If: SAM mistranslates an intrinsic that returns the whole list.
          - AllowedOrigins:
              - !If [Hosting, !Sub "https://${SiteDistribution.DomainName}", !Ref SiteOrigin]
              - !If [SecondOrigin, !Ref SecondSiteOrigin, !Ref AWS::NoValue]
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub "${UploadBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # The web app: a private bucket that only this CloudFront distribution can read.
  SiteBucket:
    Type: AWS::S3::Bucket
    Condition: Hosting
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: Hosting
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: CloudFrontReadsTheSite
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: Hosting
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: Hosting
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} web app"
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed policies: CachingOptimized and SecurityHeadersPolicy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # A list, not one !If: SAM mistranslates an intrinsic that returns the whole list.
        AllowOrigins:
          - !If [Hosting, !Sub "https://${SiteDistribution.DomainName}", !Ref SiteOrigin]
          - !If [SecondOrigin, !Ref SecondSiteOrigin, !Ref AWS::NoValue]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10

  CreateJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.create_job
      Role: !GetAtt CreateJobFunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs
            Method: POST

  GetJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.get_job
      Role: !GetAtt GetJobFunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{id}
            Method: GET

  RecheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.recheck
      Role: !GetAtt RecheckFunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{id}/checks
            Method: POST

  RetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.retry_job
      Role: !GetAtt RetryFunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /jobs/{id}/retry
            Method: POST

  # Checks on numbers the user typed in: no storage, no model call; it only signs its challenge.
  ManualCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.manual.handler
      Role: !GetAtt ManualCheckFunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /checks
            Method: POST

  SampleJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.jobs.create_sample_job
      Role: !GetAtt SampleJobFunctionRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /samples/{sample_id}
            Method: POST

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.worker.handler
      MemorySize: 512
      Timeout: 900
      ReservedConcurrentExecutions: !If [UseReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
      EventInvokeConfig:
        MaximumRetryAttempts: 1
        MaximumEventAgeInSeconds: 3600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt WorkerFailures.Arn
      Role: !GetAtt WorkerFunctionRole.Arn
      Events:
        ManifestUploaded:
          Type: S3
          Properties:
            Bucket: !Ref UploadBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
                  - Name: suffix
                    Value: manifest.json

  # Events the worker could not handle after Lambda's retry. Each record names the
  # job's upload key and the error type, never document content.
  WorkerFailures:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true

  CreateJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CreateJobFunction}"
      RetentionInDays: 7

  GetJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GetJobFunction}"
      RetentionInDays: 7

  RecheckLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RecheckFunction}"
      RetentionInDays: 7

  RetryLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RetryFunction}"
      RetentionInDays: 7

  ManualCheckLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ManualCheckFunction}"
      RetentionInDays: 7

  SampleJobLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SampleJobFunction}"
      RetentionInDays: 7

  WorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WorkerFunction}"
      RetentionInDays: 7

  # --- One role per function (no AWS managed policies): its own permissions, X-Ray writes,
  # and logs only to its own log group (the *Logging policies below). ------------------------
  CreateJobFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CreateJobFunction-1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
        - PolicyName: xray
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteTraces  # X-Ray has no resource-level permissions
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"

  CreateJobFunctionLogging:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CreateJobFunction-logs
      Roles: [!Ref CreateJobFunctionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OwnLogGroupOnly
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt CreateJobLogs.Arn

  GetJobFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GetJobFunction-1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt JobsTable.Arn
            # Signs short-lived links to the synthetic samples' page images, for highlighting: page images only.
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/samples/*/page-*.jpg"
        - PolicyName: xray
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteTraces  # X-Ray has no resource-level permissions
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"

  GetJobFunctionLogging:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: GetJobFunction-logs
      Roles: [!Ref GetJobFunctionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OwnLogGroupOnly
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt GetJobLogs.Arn

  RecheckFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RecheckFunction-1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            # Signs confirmation tokens: this one secret only, read once per cold start.
            - Sid: ReadConfirmSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ConfirmSecret
        - PolicyName: xray
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteTraces  # X-Ray has no resource-level permissions
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"

  RecheckFunctionLogging:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: RecheckFunction-logs
      Roles: [!Ref RecheckFunctionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OwnLogGroupOnly
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt RecheckLogs.Arn

  RetryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RetryFunction-1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: s3:PutObject  # a retry only writes the job's manifest again
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*/manifest.json"
        - PolicyName: xray
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteTraces  # X-Ray has no resource-level permissions
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"

  RetryFunctionLogging:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: RetryFunction-logs
      Roles: [!Ref RetryFunctionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OwnLogGroupOnly
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt RetryLogs.Arn

  ManualCheckFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManualCheckFunction-1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            # The short-lived typed-in session record (no numbers) and the typed checks' daily counters.
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            # Signs confirmation tokens: this one secret only, read once per cold start.
            - Sid: ReadConfirmSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ConfirmSecret
        - PolicyName: xray
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteTraces  # X-Ray has no resource-level permissions
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"

  ManualCheckFunctionLogging:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ManualCheckFunction-logs
      Roles: [!Ref ManualCheckFunctionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OwnLogGroupOnly
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt ManualCheckLogs.Arn

  SampleJobFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SampleJobFunction-1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/samples/*"
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
            # Signs confirmation tokens: this one secret only, read once per cold start.
            - Sid: ReadConfirmSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ConfirmSecret
        - PolicyName: xray
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteTraces  # X-Ray has no resource-level permissions
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"

  SampleJobFunctionLogging:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: SampleJobFunction-logs
      Roles: [!Ref SampleJobFunctionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OwnLogGroupOnly
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt SampleJobLogs.Arn

  WorkerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerFunction-1
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
            - Sid: ReadAndDeleteUploads
              Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub "arn:${AWS::Partition}:s3:::${StackPrefix}-${AWS::AccountId}-${AWS::Region}/uploads/*"
            - Sid: JobsTableOnly
              Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:UpdateItem]
              Resource: !GetAtt JobsTable.Arn
            # Signs confirmation tokens: this one secret only, read once per cold start.
            - Sid: ReadConfirmSecret
              Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ConfirmSecret
        # Bedrock only while Nova reads the quotes. Through an inference profile: the profile in this
        # Region, then the model in each Region it routes to, only when called through that profile.
        - !If
          - NovaThroughProfile
          - PolicyName: WorkerFunction-2
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
              - Sid: NovaInferenceProfile
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
          - !Ref AWS::NoValue
        - !If
          - NovaRegionalModels
          - PolicyName: WorkerFunction-3
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
              - Sid: NovaProfileRegions
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref ProfileModelArns
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
          - !Ref AWS::NoValue
        - !If
          - NovaGlobalModels
          - PolicyName: WorkerFunction-4
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
              - Sid: NovaGlobalRouting
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref GlobalModelArns
                Condition:
                  StringEquals:
                    aws:RequestedRegion: unspecified
                    bedrock:InferenceProfileArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
          - !Ref AWS::NoValue
        - !If
          - NovaInRegion
          - PolicyName: WorkerFunction-5
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
              - Sid: NovaInRegionModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
          - !Ref AWS::NoValue
        # Textract only while it reads the quotes. The worker sends page bytes, so Textract needs no
        # S3 access. textract:AnalyzeDocument has no resource-level permissions (the Service
        # Authorization Reference lists no resource types for it), so the resource is "*".
        - !If
          - TextractReading
          - PolicyName: WorkerFunction-6
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
              - Sid: TextractAnalyzeDocument
                Effect: Allow
                Action: textract:AnalyzeDocument
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
          - !Ref AWS::NoValue
        - PolicyName: failures-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendFailedEvents  # the worker's on-failure destination
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt WorkerFailures.Arn
        - PolicyName: xray
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteTraces  # X-Ray has no resource-level permissions
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords]
                Resource: "*"

  WorkerFunctionLogging:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: WorkerFunction-logs
      Roles: [!Ref WorkerFunctionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OwnLogGroupOnly
            Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !GetAtt WorkerLogs.Arn

  # --- Alarms: emailed through SNS to the -AlarmEmail address (README: Alarms) -----------------
  # Not encrypted with the AWS managed SNS key: CloudWatch alarms can't publish to a topic that
  # uses it. The topic carries alarm notices only, never quote content.
  Alarms:
    Type: AWS::SNS::Topic

  AlarmsByEmail:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref Alarms
      Protocol: email
      Endpoint: !Ref AlarmEmail

  FailedJobsMetric:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref WorkerLogs
      FilterPattern: '{ $.event = "job_failed" }'
      MetricTransformations:
        - MetricNamespace: SuryaLekka
          MetricName: FailedJobs
          MetricValue: "1"
          DefaultValue: 0

  FailedJobsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A job could not be read (the worker logged job_failed). See README, Alarms.
      Namespace: SuryaLekka
      MetricName: FailedJobs
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alarms]

  FailureQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Worker events that failed twice are waiting in the failure queue. See README, Alarms.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WorkerFailures.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alarms]

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A function of this stack failed (Lambda Errors). See README, Alarms.
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alarms]
      Metrics:
        - Id: f1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CreateJobFunction
            Period: 300
            Stat: Sum
        - Id: f2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetJobFunction
            Period: 300
            Stat: Sum
        - Id: f3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RecheckFunction
            Period: 300
            Stat: Sum
        - Id: f4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RetryFunction
            Period: 300
            Stat: Sum
        - Id: f5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ManualCheckFunction
            Period: 300
            Stat: Sum
        - Id: f6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref SampleJobFunction
            Period: 300
            Stat: Sum
        - Id: f7
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref WorkerFunction
            Period: 300
            Stat: Sum
        - Id: total
          Expression: SUM([f1, f2, f3, f4, f5, f6, f7])
          Label: Errors across the stack's functions
          ReturnData: true

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A function of this stack was throttled (Lambda Throttles). See README, Alarms.
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Alarms]
      Metrics:
        - Id: f1
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref CreateJobFunction
            Period: 300
            Stat: Sum
        - Id: f2
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref GetJobFunction
            Period: 300
            Stat: Sum
        - Id: f3
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RecheckFunction
            Period: 300
            Stat: Sum
        - Id: f4
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RetryFunction
            Period: 300
            Stat: Sum
        - Id: f5
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ManualCheckFunction
            Period: 300
            Stat: Sum
        - Id: f6
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref SampleJobFunction
            Period: 300
            Stat: Sum
        - Id: f7
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Throttles
              Dimensions:
                - Name: FunctionName
                  Value: !Ref WorkerFunction
            Period: 300
            Stat: Sum
        - Id: total
          Expression: SUM([f1, f2, f3, f4, f5, f6, f7])
          Label: Throttles across the stack's functions
          ReturnData: true

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  BucketName:
    Description: Private bucket for page uploads and the sample pages.
    Value: !Ref UploadBucket
  AllowedOrigin:
    Description: The one origin the API and the upload bucket accept requests from.
    Value: !If [Hosting, !Sub "https://${SiteDistribution.DomainName}", !Ref SiteOrigin]
  SiteUrl:
    Condition: Hosting
    Description: The web app, served by CloudFront.
    Value: !Sub "https://${SiteDistribution.DomainName}/"
  SiteBucketName:
    Condition: Hosting
    Description: Private bucket that holds the web app's files.
    Value: !Ref SiteBucket
  DistributionId:
    Condition: Hosting
    Description: CloudFront distribution to invalidate after uploading the web app.
    Value: !Ref SiteDistribution
