name: tests

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      # OpenCV, used by the redaction tool's tests, needs libGL.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1
      - name: Install Python packages
        run: pip install -r requirements-dev.txt -r requirements-redact.txt
      # jsdom (tests/package.json) runs web/app.js in a simulated browser; it needs Node 22.22+ or 24.15+.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install the DOM test dependency
        run: npm ci --prefix tests --no-audit --no-fund
      - name: Tests (the known flaky redaction server test is run once more if it alone fails)
        run: python scripts/ci_tests.py -q
      - name: Template lint, SAM template and translated CloudFormation
        run: python scripts/lint_template.py template.yaml
